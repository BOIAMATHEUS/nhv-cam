<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NHV Cam · OBS</title>
<meta name="description" content="Página que o OBS abre como fonte Navegador: recebe a câmera do celular por WebRTC.">
<script>
// Esta é a página do OBS. Aberta num celular (fora do OBS e fora do painel), vai para a página do
// celular com a mesma sala e chave. Para usar um celular como monitor de verdade, acrescente &ver=1.
(function () {
  var p = new URL(location.href).searchParams;
  if (!/\bOBS\//.test(navigator.userAgent) && window.parent === window && /iPhone|iPod|Android/i.test(navigator.userAgent) && !p.has('ver')) location.replace('index.html' + location.search);
})();
</script>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#stage{position:fixed;inset:0;background:#000;overflow:hidden}
/* quadro sempre 9:16, centralizado: se a fonte do OBS não estiver em 1080x1920 a imagem continua em pé */
#quadro{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);overflow:hidden;background:#000}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:50% 50%;will-change:transform;background:transparent}
#hud{position:fixed;left:16px;top:16px;font:500 14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#fff;background:rgba(0,0,0,.55);padding:8px 12px;border-radius:10px;letter-spacing:.2px;pointer-events:none;max-width:80vw;white-space:pre-line}
#hud.oculto{display:none}
</style>
</head>
<body>
<div id="stage"><div id="quadro"><video id="v" autoplay playsinline muted></video></div></div>
<div id="hud" class="oculto"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="core.js"></script>
<script>
(() => {
  'use strict';
  const { Signal, LoteIce, limparSala, transformCss, ordenarCodecs, parSelecionado, caminho } = window.NHVCam;
  const CFG = window.NHVCAM_CONFIG;
  const q = new URL(location.href).searchParams;
  const salaBase = limparSala(q.get('r') || q.get('sala')) || 'cam1';
  const chave = limparSala(q.get('k'));
  const sala = chave ? salaBase + '-' + chave : salaBase;   // sala real no sinal
  const rotulo = salaBase + (chave ? ' · ' + chave : '');
  const preview = q.get('preview') === '1';          // prévia do painel: pede meia resolução
  const hudModo = q.get('hud') || 'auto';             // 1 sempre, 0 nunca, auto só antes da primeira conexão
  const codecPref = (q.get('codec') || 'auto').toLowerCase();
  const fitParam = q.get('fit');                      // cover | contain (vence o que o celular manda)
  const cheio = q.get('cheio') === '1';               // preenche a fonte inteira, seja qual for a proporção (collab.html)
  const noObs = /\bOBS\//.test(navigator.userAgent);
  const querAudio = noObs || q.get('audio') === '1';
  const noPai = window.parent && window.parent !== window;
  const v = document.getElementById('v'), hud = document.getElementById('hud');
  if (q.get('bg')) document.getElementById('stage').style.background = /^[0-9a-f]{3,8}$/i.test(q.get('bg')) ? '#' + q.get('bg') : q.get('bg');

  // Colchão de reprodução (ms): a imagem absorve oscilação do Wi-Fi em vez de travar. Padrão 150 ms
  // no OBS, 0 na prévia do painel; ajustável com &buffer=300 no link.
  const bufferMs = q.get('buffer') !== null && Number.isFinite(Number(q.get('buffer'))) ? Math.max(0, Math.min(4000, Number(q.get('buffer')))) : (preview ? 0 : 150);
  const NEGOCIACAO_MS = 10000;  // enquanto negocia, não repete o "oi"
  const DESCONECTADO_MS = 12000; // tempo para o celular recuperar por reinício de ICE antes de recomeçar do zero
  const SEM_IMAGEM_S = 15;       // conectado mas sem quadro novo por tanto tempo: recomeça

  // Tamanho que o OBS deu à fonte. O certo é 1080x1920 (ou outro 9:16 de pelo menos 1080 de largura).
  const quadro = document.getElementById('quadro');
  const fonte = { w: 0, h: 0, ok: true };
  function ajustarQuadro() {
    const w = window.innerWidth, h = window.innerHeight;
    let qw, qh;
    if (cheio) { qw = w; qh = h; }
    else if (w / h > 9 / 16) { qh = h; qw = Math.round(h * 9 / 16); } else { qw = w; qh = Math.round(w * 16 / 9); }
    quadro.style.width = qw + 'px'; quadro.style.height = qh + 'px';
    fonte.w = w; fonte.h = h; fonte.ok = cheio || (Math.abs(w / h - 9 / 16) < 0.01 && w >= 1080);
  }
  window.addEventListener('resize', ajustarQuadro);
  ajustarQuadro();
  function avisoFonte() { return fonte.ok ? '' : ' · fonte em ' + fonte.w + 'x' + fonte.h + ', defina largura 1080 e altura 1920'; }

  const view = { scale: 1, x: 0, y: 0, mirror: false, fit: fitParam || 'cover' };
  let sig = null, pc = null, dc = null, lote = null, origem = null, pendentes = [];
  let timerHello = null, timerDesc = null, conectado = false, jaConectou = false, negociandoDesde = 0;
  let ultimoFrames = -1, semFrames = 0, bytesAnt = 0, tAnt = 0;

  function aplicarView() { v.style.transform = transformCss(view); v.style.objectFit = view.fit === 'contain' ? 'contain' : 'cover'; }
  function estado(nome, detalhe) {
    if (!noPai) return;
    try { window.parent.postMessage({ nhvcam: 'estado', sala: salaBase, estado: nome, detalhe: detalhe || '' }, '*'); } catch (e) {}
  }
  // Depois da primeira conexão nunca mais aparece texto por cima do vídeo (fica o último quadro),
  // a não ser com hud=1.
  function setHud(texto) {
    const mostrar = hudModo === '1' ? true : hudModo === '0' ? false : (!conectado && !jaConectou);
    hud.textContent = texto || '';
    hud.classList.toggle('oculto', !mostrar || !texto);
  }
  function tocar() {
    v.play().catch(() => {});
    if (querAudio) { v.muted = false; v.play().catch(() => { v.muted = true; v.play().catch(() => {}); }); }
  }
  function negociando() { return !!pc && !conectado && performance.now() - negociandoDesde < NEGOCIACAO_MS; }
  function pedir() { if (sig && sig.status === 'SUBSCRIBED') sig.enviar('hello', { preview }); }
  function iniciarHello() {
    clearInterval(timerHello);
    if (!negociando()) pedir();
    timerHello = setInterval(() => {
      if (conectado) { clearInterval(timerHello); return; }
      if (negociando()) return;
      pedir();
    }, 2500);
  }
  function limparPc() {
    clearTimeout(timerDesc);
    if (pc) { try { pc.onconnectionstatechange = null; pc.ontrack = null; pc.close(); } catch (e) {} }
    pc = null; dc = null; pendentes = []; conectado = false; ultimoFrames = -1; semFrames = 0; bytesAnt = 0; tAnt = 0; negociandoDesde = 0;
  }
  function caiu(msg) { limparPc(); setHud('NHV Cam · ' + rotulo + ' · ' + msg); estado('aguardando', msg); iniciarHello(); }
  function armarQueda(meu) {
    clearTimeout(timerDesc);
    timerDesc = setTimeout(() => { if (pc === meu && meu.connectionState !== 'connected') caiu('conexão caiu, reconectando'); }, DESCONECTADO_MS);
  }
  function drenar() {
    if (!pc || !pc.remoteDescription) return;
    const fila = pendentes; pendentes = [];
    for (const c of fila) pc.addIceCandidate(c).catch((e) => console.warn('ice', e));
  }
  function preferirCodec(meu) {
    try {
      if (!(window.RTCRtpReceiver && RTCRtpReceiver.getCapabilities)) return;
      const caps = RTCRtpReceiver.getCapabilities('video');
      for (const t of meu.getTransceivers()) {
        if (t.receiver && t.receiver.track && t.receiver.track.kind === 'video' && t.setCodecPreferences) t.setCodecPreferences(ordenarCodecs(caps.codecs, codecPref));
      }
    } catch (e) { console.warn('codec', e); }
  }

  async function aoOferta(m) {
    limparPc();
    clearInterval(timerHello);
    origem = m.from;
    negociandoDesde = performance.now();
    const meu = new RTCPeerConnection({ iceServers: CFG.iceServers, bundlePolicy: 'max-bundle' });
    pc = meu;
    lote = new LoteIce((cands) => sig.enviar('ice', { candidates: cands }, origem));
    meu.onicecandidate = (e) => { if (e.candidate) lote.add(e.candidate.toJSON()); else lote.flush(); };
    meu.ontrack = (e) => {
      const ms = (e.streams && e.streams[0]) || new MediaStream([e.track]);
      if (v.srcObject !== ms) v.srcObject = ms;
      tocar();
      try {
        if (e.receiver && e.track && e.track.kind === 'video') {
          if ('jitterBufferTarget' in e.receiver) e.receiver.jitterBufferTarget = bufferMs;
          else if ('playoutDelayHint' in e.receiver) e.receiver.playoutDelayHint = bufferMs / 1000;
        }
      } catch (err) { console.warn('buffer', err); }
    };
    meu.ondatachannel = (e) => {
      dc = e.channel;
      dc.onmessage = (ev) => {
        try {
          const d = JSON.parse(ev.data);
          if (d.type === 'view') { Object.assign(view, d); if (fitParam) view.fit = fitParam; aplicarView(); }
        } catch (err) {}
      };
    };
    meu.onconnectionstatechange = () => {
      if (pc !== meu) return;
      const st = meu.connectionState;
      if (st === 'connected') { conectado = true; jaConectou = true; clearInterval(timerHello); clearTimeout(timerDesc); setHud(''); estado('conectado'); }
      else if (st === 'closed') caiu('conexão fechada, reconectando');
      else if (st === 'failed' || st === 'disconnected') { conectado = false; armarQueda(meu); estado('aguardando', 'recuperando a conexão'); }
    };
    await meu.setRemoteDescription(m.data.sdp);
    if (pc !== meu) return;
    preferirCodec(meu);
    const resposta = await meu.createAnswer();
    if (pc !== meu) return;
    await meu.setLocalDescription(resposta);
    if (pc !== meu) return;
    sig.enviar('answer', { sdp: { type: meu.localDescription.type, sdp: meu.localDescription.sdp } }, origem);
    drenar();
    setHud('NHV Cam · ' + rotulo + ' · conectando ao celular');
  }

  // Oferta de reinício de ICE do mesmo celular: responde na MESMA conexão (sem trocar o vídeo).
  async function renegociar(m) {
    const meu = pc;
    negociandoDesde = performance.now();
    await meu.setRemoteDescription(m.data.sdp);
    if (pc !== meu) return;
    const resposta = await meu.createAnswer();
    if (pc !== meu) return;
    await meu.setLocalDescription(resposta);
    if (pc !== meu) return;
    sig.enviar('answer', { sdp: { type: meu.localDescription.type, sdp: meu.localDescription.sdp } }, origem);
    drenar();
  }

  function aoReceber(m) {
    if (m.role !== 'cam') return;
    if (m.kind === 'offer') {
      const falhou = (e) => { console.warn(e); setHud('NHV Cam · ' + rotulo + ' · erro: ' + e.message); estado('erro', e.message); };
      if (pc && m.from === origem && m.data.renegociar) renegociar(m).catch((e) => { console.warn('renegociação falhou, recomeçando', e); aoOferta(m).catch(falhou); });
      else aoOferta(m).catch(falhou);
    }
    else if (m.kind === 'ice') { if (m.from !== origem) return; pendentes.push.apply(pendentes, m.data.candidates || []); drenar(); }
    else if (m.kind === 'hello') { if ((!conectado || m.from !== origem) && !negociando()) pedir(); }  // celular (re)entrou: pede oferta nova
    else if (m.kind === 'bye') { if (m.from === origem) caiu('celular saiu, aguardando'); }
  }

  // estatísticas (HUD, painel e retorno ao celular) e vigia de imagem parada
  setInterval(async () => {
    if (!pc || !conectado) return;
    try {
      const st = await pc.getStats();
      let inb = null;
      st.forEach((r) => { if (r.type === 'inbound-rtp' && (r.kind === 'video' || r.mediaType === 'video')) inb = r; });
      if (!inb) return;
      const agora = performance.now();
      const bps = tAnt ? (inb.bytesReceived - bytesAnt) * 8 / ((agora - tAnt) / 1000) : 0;
      bytesAnt = inb.bytesReceived; tAnt = agora;
      const frames = inb.framesDecoded || 0;
      if (frames === ultimoFrames) { semFrames++; if (semFrames >= SEM_IMAGEM_S) { caiu('sem imagem, reconectando'); return; } }
      else semFrames = 0;
      ultimoFrames = frames;
      const w = inb.frameWidth || v.videoWidth, h = inb.frameHeight || v.videoHeight;
      const fps = Math.round(inb.framesPerSecond || 0);
      const sel = parSelecionado(st);
      const cam = sel ? caminho(sel.loc, sel.rem) : { nome: '', grau: '' };
      const rtt = sel ? sel.rtt : null;
      const info = w + 'x' + h + ' · ' + fps + ' fps · ' + (bps / 1e6).toFixed(1) + ' Mbps' + (cam.nome ? ' · ' + cam.nome : '') + (rtt != null ? ' · ' + rtt + ' ms' : '');
      if (hudModo === '1') setHud(rotulo + ' · ' + info);
      estado('conectado', info);
      if (dc && dc.readyState === 'open') dc.send(JSON.stringify({ type: 'rx', w, h, fps, caminho: cam.nome, grau: cam.grau, rtt, vw: fonte.w, vh: fonte.h, fonteOk: fonte.ok }));
    } catch (e) {}
  }, 1000);

  (async () => {
    aplicarView();
    setHud('NHV Cam · ' + rotulo + ' · conectando ao sinal');
    estado('conectando');
    try {
      sig = new Signal(sala, 'view');
    } catch (e) { setHud('NHV Cam · ' + rotulo + ' · ' + e.message); estado('erro', e.message); return; }
    sig.onmessage = aoReceber;
    sig.onstatus = (st) => {
      if (st === 'SUBSCRIBED') { if (!conectado) { setHud('NHV Cam · ' + rotulo + ' · aguardando o celular' + avisoFonte()); estado('aguardando'); iniciarHello(); } }
      else if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT') { setHud('NHV Cam · ' + rotulo + ' · sinal indisponível (' + st + ')'); estado('erro', st); }
    };
    try { await sig.conectar(); }
    catch (e) { setHud('NHV Cam · ' + rotulo + ' · falha no sinal: ' + ((e && e.message) || e)); estado('erro', String(e)); }
  })();

  function despedir() {
    clearInterval(timerHello);
    if (sig && origem) sig.enviar('bye', {}, origem);
    limparPc();
  }
  window.addEventListener('pagehide', despedir);
  // o painel avisa antes de descarregar a prévia, para o "bye" chegar no celular com folga
  window.addEventListener('message', (e) => {
    if (!e.data || e.data.nhvcam !== 'fechar') return;
    despedir();
    setTimeout(() => { try { sig.fechar(); } catch (err) {} }, 300);
  });
  // clique na página: destrava o som quando o navegador bloqueou autoplay com áudio
  document.addEventListener('click', () => { if (querAudio) { v.muted = false; v.play().catch(() => {}); } });

  // ganchos para o teste automatizado
  window.__nhvcamView = { pc: () => pc, conectado: () => conectado, jaConectou: () => jaConectou, sala };
})();
</script>
</body>
</html>
